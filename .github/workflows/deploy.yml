name: 🚀 Deploy a Hostinger

on:
  push:
    branches:
      - main  # Se ejecuta cada vez que se hace push a main

# El token de GitHub solo necesita leer el repositorio
permissions:
  contents: read

# Evita que dos despliegues se pisen si haces varios push seguidos
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy por FTPS a Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Descargar código
        uses: actions/checkout@v5

      - name: ⚙️ Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🎨 Compilar Tailwind
        run: npm run build

      # Si el CSS no se genero, es mejor abortar que subir la pagina sin estilos
      - name: ✅ Verificar que el CSS existe
        run: test -s css/tailwind.css

      - name: 📤 Subir archivos a Hostinger por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # FTP plano envia usuario y contraseña sin cifrar por internet.
          # FTPS cifra la conexion. Si Hostinger rechaza, probar: ftps-legacy
          protocol: ftps
          timeout: 90000
          # Excluir del servidor todo lo que es solo para desarrollo
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            **/*.md
            src/**
            package.json
            package-lock.json
            tailwind.config.js
